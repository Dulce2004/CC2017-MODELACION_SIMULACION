<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador SIR - Laboratorio 3</title>
    <!-- Importar biblioteca Chart.js para la gráfica -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f8f9fa; }
        .dashboard { display: flex; gap: 20px; }
        .controles { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .metricas { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .grafica-container { background: white; padding: 20px; border-radius: 8px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .slider-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="range"] { width: 100%; }
        .metric-box { font-size: 1.1em; margin-bottom: 15px; }
        .metric-value { font-weight: bold; color: #0056b3; }
        #indicador-r0 { padding: 5px 10px; border-radius: 4px; font-weight: bold; color: white; display: inline-block;}
    </style>
</head>
<body>

    <h2>Simulador de Dinámica de Contagio (Modelo SIR)</h2>

    <div class="dashboard">
        <!-- Panel de Controles -->
        <div class="controles">
            <h3>Controles de la Epidemia</h3>
            
            <div class="slider-group">
                <label>Número reproductivo (R0): <span id="r0-val">2.5</span></label>
                <input type="range" id="R0" min="0.5" max="5.0" step="0.1" value="2.5">
            </div>

            <div class="slider-group">
                <label>Período infeccioso (1/γ en días): <span id="gamma-val">7</span></label>
                <input type="range" id="gamma_inv" min="3" max="21" step="1" value="7">
            </div>

            <div class="slider-group">
                <label>Fracción inicial infectada (I(0)/N): <span id="i0-val">0.001</span></label>
                <input type="range" id="i0_frac" min="0.001" max="0.05" step="0.001" value="0.001">
            </div>
        </div>

        <!-- Panel de Métricas -->
        <div class="metricas">
            <h3>Panel de Métricas</h3>
            <div class="metric-box">Valor actual de R0: <span class="metric-value" id="out-r0">2.5</span></div>
            <div class="metric-box">Estado: <span id="indicador-r0">Evaluando...</span></div>
            <div class="metric-box">Umbral Inmunidad (p*): <span class="metric-value" id="out-pstar">0%</span></div>
            <div class="metric-box">Pico de infectados: <span class="metric-value" id="out-peak">0%</span></div>
            <div class="metric-box">Tiempo al pico: <span class="metric-value" id="out-time">0 días</span></div>
        </div>
    </div>

    <!-- Contenedor de la gráfica -->
    <div class="grafica-container">
        <canvas id="sirChart" height="100"></canvas>
    </div>

    <script>
        let sirChart = null;

        // Diapositiva 4: estructura del modelo SIR (S, I, R) y ecuaciones de transmisión/recuperación.
        // Diapositiva 5: uso de R0 = beta/gamma y el criterio de crecimiento/extinción.
        // Diapositiva 12: sensibilidad del modelo al variar parámetros inciertos como beta.
        // Función para resolver el modelo SIR numéricamente (Método de Euler)
        function simularSIR(R0, gamma_inv, I0_frac) {
            let dias = 150; // Días a simular
            let h = 1; // Paso de tiempo de 1 día
            
            let gamma = 1.0 / gamma_inv;
            let beta = R0 * gamma; // R0 = beta / gamma
            
            let S = 1.0 - I0_frac;
            let I = I0_frac;
            let R = 0.0;
            
            let data_S = [S * 100];
            let data_I = [I * 100];
            let data_R = [R * 100];
            let labels = [0];
            
            let max_I = I * 100;
            let time_peak = 0;

            for (let t = 1; t <= dias; t++) {
                // Ecuaciones diferenciales SIR
                let dS = -beta * S * I;
                let dI = beta * S * I - gamma * I;
                let dR = gamma * I;

                S += dS * h;
                I += dI * h;
                R += dR * h;

                let I_porcentaje = I * 100;
                
                data_S.push(S * 100);
                data_I.push(I_porcentaje);
                data_R.push(R * 100);
                labels.push(t);

                // Encontrar el pico
                if (I_porcentaje > max_I) {
                    max_I = I_porcentaje;
                    time_peak = t;
                }
            }

            return { labels, data_S, data_I, data_R, max_I, time_peak };
        }

        // Función para actualizar toda la interfaz
        function updateDashboard() {
            // Diapositiva 5: lectura de R0 y umbral de inmunidad de grupo para evaluar crecimiento.
            // Diapositiva 12: variar parámetros inciertos y observar cómo cambian las conclusiones del modelo.
            // Obtener valores de los sliders
            let R0 = parseFloat(document.getElementById('R0').value);
            let gamma_inv = parseFloat(document.getElementById('gamma_inv').value);
            let I0_frac = parseFloat(document.getElementById('i0_frac').value);

            // Actualizar textos de los sliders
            document.getElementById('r0-val').innerText = R0.toFixed(1);
            document.getElementById('gamma-val').innerText = gamma_inv;
            document.getElementById('i0-val').innerText = I0_frac.toFixed(3);

            // Correr simulación
            let sim = simularSIR(R0, gamma_inv, I0_frac);

            // Actualizar panel de métricas
            document.getElementById('out-r0').innerText = R0.toFixed(1);
            
            let p_star = R0 > 1 ? (1 - (1/R0)) * 100 : 0;
            document.getElementById('out-pstar').innerText = p_star.toFixed(1) + "%";
            
            document.getElementById('out-peak').innerText = sim.max_I.toFixed(1) + "% de la población";
            document.getElementById('out-time').innerText = sim.time_peak + " días";

            let indicador = document.getElementById('indicador-r0');
            if (R0 > 1) {
                indicador.innerText = "La epidemia crece (R0 > 1)";
                indicador.style.backgroundColor = "#dc3545"; // Rojo
            } else {
                indicador.innerText = "La epidemia se extingue (R0 < 1)";
                indicador.style.backgroundColor = "#28a745"; // Verde
            }

            // Actualizar la gráfica
            let data_Capacidad = new Array(sim.labels.length).fill(10); // Línea constante al 10%

            if (sirChart) {
                sirChart.destroy(); // Limpiar gráfica anterior
            }

            const ctx = document.getElementById('sirChart').getContext('2d');
            sirChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sim.labels,
                    datasets: [
                        { label: 'Susceptibles S(t)', data: sim.data_S, borderColor: '#007bff', tension: 0.1, pointRadius: 0 },
                        { label: 'Infectados I(t)', data: sim.data_I, borderColor: '#dc3545', backgroundColor: 'rgba(220, 53, 69, 0.1)', fill: true, tension: 0.1, pointRadius: 0, borderWidth: 2 },
                        { label: 'Recuperados R(t)', data: sim.data_R, borderColor: '#28a745', tension: 0.1, pointRadius: 0 },
                        { label: 'Capacidad Hospitalaria (10%)', data: data_Capacidad, borderColor: 'black', borderDash: [5, 5], borderWidth: 1, pointRadius: 0, fill: false }
                    ]
                },
                options: {
                    responsive: true,
                    animation: { duration: 0 }, // Animación a 0 para actualización en tiempo real (<500ms)
                    scales: {
                        y: { 
                            title: { display: true, text: 'Porcentaje de la Población (%)', font: {weight: 'bold'} },
                            min: 0, max: 100 
                        },
                        x: { 
                            title: { display: true, text: 'Tiempo (días)', font: {weight: 'bold'} }
                        }
                    }
                }
            });
        }

        // Agregar Event Listeners a los sliders para actualizar en tiempo real
        document.getElementById('R0').addEventListener('input', updateDashboard);
        document.getElementById('gamma_inv').addEventListener('input', updateDashboard);
        document.getElementById('i0_frac').addEventListener('input', updateDashboard);

        // Inicializar dashboard al cargar la página
        updateDashboard();
    </script>
</body>
</html>
